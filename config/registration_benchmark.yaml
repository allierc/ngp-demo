name: vermeer_registration_benchmark
seed: 0
device: cuda

image:
  path: assets/girl_with_a_pearl_earring.jpg
  channels: gray
  downsample: 2
  foreground:
    threshold: 0.06
    blur_px: 3
    dilate_px: 12

warp:
  convention: target(x) = source(x + u(x))
  resample: bilinear
  padding: border
  units: pixels

deformations:
  - name: global_smooth
    type: fourier
    n_modes: 3
    k_max: 2
    max_displacement_px: 24
  - name: local_bending
    type: gaussian_bumps
    n_bumps: 6
    sigma_px: [30, 80]
    max_displacement_px: 20
    placement: foreground
  - name: global_plus_local
    type: sum
    terms: [global_smooth, local_bending]
  - name: slip_band
    type: shear_band
    angle_deg: 35
    width_px: 12
    offset_px: 18
    placement: foreground

models:
  - name: ngp
    kind: hash_grid
    encoding:
      n_levels: 14
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 8
      per_level_scale: 1.5
      max_resolution: 512
      interpolation: smoothstep
    decoder:
      n_neurons: 64
      n_hidden_layers: 2
      activation: gelu
    output_scale_px: 40
    coarse_to_fine:
      enabled: true
      start_levels: 4
      full_at_step: 1500
  - name: ngp_no_c2f
    inherits: ngp
    coarse_to_fine:
      enabled: false
  - name: tensor_16
    kind: control_grid
    grid: [16, 16]
    interpolation: bilinear
    output_scale_px: 40
  - name: tensor_64
    inherits: tensor_16
    grid: [64, 64]
  - name: tensor_256
    inherits: tensor_16
    grid: [256, 256]

training:
  steps: 3000
  batch: 65536
  optimizer: adam
  lr:
    hash_grid: 1.0e-2
    control_grid: 5.0e-2
  lr_schedule: cosine
  lr_final_fraction: 0.03
  sampling:
    foreground_fraction: 0.9
    jitter: subpixel
  loss:
    photometric:
      kind: l2
      normalize: none
    smoothness:
      kind: gradient_l2
      weight: 1.0e-3
      source: autograd
    folding:
      kind: hinge_negative_jacobian
      weight: 1.0e-2
      source: autograd

metrics:
  photometric:
    - psnr_warped_vs_target
    - ncc_warped_vs_target
  field:
    - endpoint_error_px_mean
    - endpoint_error_px_p95
    - endpoint_error_px_foreground
    - endpoint_error_px_background
    - endpoint_error_px_boundary_band
  regularity:
    - jacobian_det_min
    - jacobian_det_negative_fraction
    - bending_energy
  cost:
    - n_parameters
    - seconds_to_target_psnr
    - peak_gpu_mb
  evaluation:
    resolution: full
    boundary_band_px: 24
    jacobian_from: autograd

visualization:
  warped_grid_overlay:
    spacing_px: 32
    on: [ground_truth, ngp, tensor_16]
  level_hierarchy:
    levels: [0, 4, 8, 11, 13]
    draw_cells_on_image: true
    partial_sum_reconstruction: true
    per_level_displacement_norm: true
  error_maps:
    endpoint_error: true
    jacobian_determinant: true
  dpi: 130

runs:
  cross: [deformations, models]
  repeats: 1
  out: out/registration
